<html>
<head>
    <title>CSS1</title>
    <style>
        body {
            background-image: url('img/fondo.webp');
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        @keyframes brillo {
            0%, 100% { color: black; }
            50%       { color: yellow; text-shadow: 0 0 15px black, 0 0 30px yellow; }
        }

        h1 {
            text-align: center;
            animation: brillo 1.5s infinite;
            color: white;
        }

        a {
            display: block;
            width: 220px;
            padding: 10px 20px;
            margin-bottom: 10px;
            background-color: rgba(0, 0, 0, 0.45);
            border: 2px solid blue;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 15px;
        }

        a:hover {
            background-color: rgba(0, 0, 0, 0.65);
        }
    </style>
</head>
<body>
    <h1>Animacion CSS 1 - Formas</h1>

</body>
</html>
