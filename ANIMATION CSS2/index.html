<html>
<head>
    <title>ANIMACION CSS2</title>
    <style>
        body {
            background-color: rgb(248, 185, 48);
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        @keyframes brillo {
            0%, 100% { color: black; }
            50%       { color: yellow; text-shadow: 0 0 15px black, 0 0 30px yellow; }
        }

        h1 {
            text-align: center;
            animation: brillo 1.5s infinite;
            color: white;
        }

        a {
            display: block;
            width: 220px;
            padding: 10px 20px;
            margin-bottom: 10px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px solid blue;
            border-radius: 20px;
            text-decoration: none;
            color: black;
            font-size: 15px;
        }

        a:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <h1>Animacion CSS 2 - Efectos</h1>

    <a href="animacion1.html">Pagina</a>
    <a href="../index.html">Volver</a>
</body>
</html>
