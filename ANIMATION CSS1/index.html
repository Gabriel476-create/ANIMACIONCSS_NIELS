<html>
<head>
    <title>CSS1</title>
    <style>
        body {
            background-color: rgb(248, 185, 48);
            background-image: url('img/fondo.webp');
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        @keyframes brillo {
            0%, 100% { color: white; }
            50% { color: yellow; text-shadow: 0 0 10px white; }
        }

        h1 {
            text-align: center;
            animation: brillo 1.5s infinite;
        }

        a {
            display: block;
            width: 200px;
            padding: 10px 20px;
            margin-bottom: 10px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px solid white;
            border-radius: 20px;
            text-decoration: none;
            color: black;
            font-size: 15px;
        }

        a:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <h1>Animacion CSS 1 - Formas</h1>

</body>
</html>
