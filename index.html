<!DOCTYPE html>
<html>
<head>
    <title>ANIMACIONES CSS</title>
    <style>

        body {
            background-color: rgb(248, 185, 48);
            background-image: url('img/fondo informatica.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .titulo {
            text-align: center;
            color: white;
            font-size: 3rem;
            text-shadow: 0 0 10px #ff6600, 0 0 25px #ff6600, 0 0 50px #ff6600;
            margin-bottom: 40px;
        }

        .fondo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .caja {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: #111;
            transition: transform 0.2s;
        }

        .caja:hover {
            transform: translateY(-4px);
        }

        .foto {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .texto {
            padding: 14px 16px;
        }

        .subtitulo {
            font-size: 0.95rem;
            margin: 0;
        }

    </style>
</head>
<body>

    <div class="titulo">ANIMACIONES CSS</div>

    <div class="fondo">

        <a class="caja" href="ANIMATION CSS1/index.html">
            <img class="foto" src="img/ajedrez.png" alt="Animacion 1">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS 1 - FORMAS</p>
            </div>
        </a>

        <a class="caja" href="ANIMATION CSS2/index.html">
            <img class="foto" src="img/pagina icono.png" alt="Animacion 2">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS 2 - EFECTOS</p>
            </div>
        </a>

        <a class="caja" href="ANIMATION CSS3/index.html">
            <img class="foto" src="img/anim_pasos.gif" alt="Animacion 3">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS 3 - MOVIMIENTO</p>
            </div>
        </a>

        <a class="caja" href="ANIMATION CSS4 - animacion por pasos/index.html">
            <img class="foto" src="img/coco icono.png" alt="Animacion 4">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS 4 - ANIMACION POR PASOS</p>
            </div>
        </a>

        <a class="caja" href="ANIMATION CSS5 - CLIPPATH/index.html">
            <img class="foto" src="img/parallax.jpg" alt="Animacion 5">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS 5 - ANIMACION PAYASO Y CLIPPATH</p>
            </div>
        </a>

        <a class="caja" href="ANIMATION CSS6 - PARALLAX 2/index.html">
            <img class="foto" src="img/parallax2" alt="Animacion 6">
            <div class="texto">
                <p class="subtitulo">ANIMACION CSS6 - PARALLAX 2</p>
            </div>
        </a>

    </div>

</body>
</html>
