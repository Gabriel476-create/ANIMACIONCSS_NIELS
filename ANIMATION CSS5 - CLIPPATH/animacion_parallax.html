<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLAX SEMANA 6</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: #111;
    height: 2000px;
    overflow-x: hidden;
}

.contenedor{
    width: 900px;
    height: 560px;
    margin: 30px auto;
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
}

.fondo,
.niebla1,
.niebla2,
.niebla3,
.niebla4,
.niebla5,
.niebla6,
.niebla7{
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
}

.fondo{
    z-index: 1;
    background-image: url(img/fondito.jpg);
    background-size: 100% auto;
    background-position: center;
    background-repeat: no-repeat;
    animation: zoom 8s infinite alternate ease-in-out;
}

@keyframes zoom{

    0%{
        background-size: 100% auto;
    }

    100%{
        background-size: 115% auto;
    }
}

.niebla1{
    z-index: 2;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 160% auto;
    background-position: left 20%;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(8px);
    animation: niebla1 11s infinite linear;
}

.niebla2{
    z-index: 2;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 160% auto;
    background-position: right 25%;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(6px);
    animation: niebla2 14s infinite linear;
}

.niebla3{
    z-index: 3;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 200% auto;
    background-position: center 60%;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(4px);
    animation: niebla3 10s infinite linear;
}

.niebla4{
    z-index: 4;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 200% auto;
    background-position: left bottom;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(3px);
    animation: niebla4 8s infinite linear;
}

.niebla5{
    z-index: 4;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 200% auto;
    background-position: right bottom;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(4px);
    animation: niebla5 12s infinite linear;
}

.niebla6{
    z-index: 6;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 120% auto;
    background-position: center 75%;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(10px);
    animation: niebla6 16s infinite linear;
}

.niebla7{
    z-index: 3;
    background-image: url(img/NIEBLA.png);
    background-repeat: no-repeat;
    background-size: 180% auto;
    background-position: center 45%;
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(12px);
    animation: niebla7 20s infinite linear;
}

.arbolIzquierda{
    width: 65%;
    height: 110%;
    position: absolute;
    top: -20px;
    left: -40px;
    z-index: 5;
    animation: moverIzquierda 5s forwards ease-in-out;
}

.arbolDerecha{
    width: 65%;
    height: 110%;
    position: absolute;
    top: -20px;
    right: -40px;
    z-index: 5;
    animation: moverDerecha 5s forwards ease-in-out;
}

.personaje{
    width: 78px;
    position: absolute;
    left: 400px;
    top: 400px;
    z-index: 5;
    filter: drop-shadow(0 0 12px black);
    opacity: 0;
    animation: aparecer 1.5s ease-out 5.5s forwards;
}

@keyframes niebla1{

    0%{
        left: -200px;
        opacity: 0;
    }

    8%{
        opacity: 0.7;
    }

    88%{
        opacity: 0.7;
    }

    96%{
        left: 200px;
        opacity: 0;
    }

    100%{
        left: -200px;
        opacity: 0;
    }
}

@keyframes niebla2{

    0%{
        left: 200px;
        opacity: 0;
    }

    8%{
        opacity: 0.6;
    }

    88%{
        opacity: 0.6;
    }

    96%{
        left: -200px;
        opacity: 0;
    }

    100%{
        left: 200px;
        opacity: 0;
    }
}

@keyframes niebla3{

    0%{
        left: -180px;
        opacity: 0;
    }

    8%{
        opacity: 0.75;
    }

    88%{
        opacity: 0.75;
    }

    96%{
        left: 180px;
        opacity: 0;
    }

    100%{
        left: -180px;
        opacity: 0;
    }
}

@keyframes niebla4{

    0%{
        left: -160px;
        opacity: 0;
    }

    8%{
        opacity: 0.85;
    }

    88%{
        opacity: 0.85;
    }

    96%{
        left: 160px;
        opacity: 0;
    }

    100%{
        left: -160px;
        opacity: 0;
    }
}

@keyframes niebla5{

    0%{
        left: 160px;
        opacity: 0;
    }

    8%{
        opacity: 0.80;
    }

    88%{
        opacity: 0.80;
    }

    96%{
        left: -160px;
        opacity: 0;
    }

    100%{
        left: 160px;
        opacity: 0;
    }
}

@keyframes niebla6{

    0%{
        left: 100px;
        opacity: 0;
    }

    8%{
        opacity: 0.65;
    }

    88%{
        opacity: 0.65;
    }

    96%{
        left: -100px;
        opacity: 0;
    }

    100%{
        left: 100px;
        opacity: 0;
    }
}

@keyframes niebla7{

    0%{
        left: -250px;
        opacity: 0;
    }

    8%{
        opacity: 0.5;
    }

    88%{
        opacity: 0.5;
    }

    96%{
        left: 250px;
        opacity: 0;
    }

    100%{
        left: -250px;
        opacity: 0;
    }
}

@keyframes moverIzquierda{

    0%{
        left: -40px;
    }

    55%{
        left: -40px;
    }

    80%{
        left: -80px;
    }

    100%{
        left: -1200px;
    }
}

@keyframes moverDerecha{

    0%{
        right: -40px;
    }

    55%{
        right: -40px;
    }

    80%{
        right: -80px;
    }

    100%{
        right: -1200px;
    }
}

@keyframes aparecer{

    0%{
        top: 400px;
        opacity: 0;
    }

    50%{
        top: 350px;
        opacity: 0.7;
    }

    75%{
        top: 365px;
        opacity: 0.9;
    }

    100%{
        top: 360px;
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="fondo"></div>

    <div class="niebla1"></div>
    <div class="niebla2"></div>
    <div class="niebla3"></div>
    <div class="niebla4"></div>
    <div class="niebla5"></div>
    <div class="niebla7"></div>

    <img src="img/arb-Photoroom.png" class="arbolIzquierda">
    <img src="img/arb-Photoroom.png" class="arbolDerecha">

    <img src="img/sp-Photoroom.png" class="personaje">

    <div class="niebla6"></div>

</div>

<script>

var escena = document.querySelector('.contenedor');

setTimeout(function(){

    window.addEventListener('scroll', function(){

        var scroll = window.scrollY;

        escena.style.top = (scroll * 0.05) + "px";

    });

}, 5000);

</script>

</body>
</html>
