<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIPPATH SEMANA 6</title>

    <style>

        *{
            padding: 0px;
            margin: 0px;
        }

        body{
            background-color: lightblue;
        }

        .contenedor{
            width: 880px;
            height: 600px;
            border: 1px solid black;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        .parque{
            position: absolute;
            top:0px;
            left:0px;
            width: 100%;
            height: 100%;
            z-index: -3;
        }

        .gorrito{
            width: 120px;
            height: 120px;
            background-image: url(img/gorrito.jpg);
            background-size: cover;
            background-position: center;
            clip-path: polygon(50% 0%, 20% 78%, 79% 78%);
            position: absolute;
            top: 130px;
            left: 90px;
            z-index: 3;

            animation: gorro 2s infinite alternate;
        }

        @keyframes gorro{
            from{
                transform: rotate(-5deg);
            }
            to{
                transform: rotate(5deg);
            }
        }

        .cara{
            width: 140px;
            height: 140px;
            background-image: url(img/cara.png);
            background-size: cover;
            background-position: center;
            clip-path: circle(43.2% at 50% 50%);
            position: absolute;
            top: 200px;
            left: 80px;
            z-index: 2;

            animation: cara 2s infinite alternate;
        }

        @keyframes cara{
            from{
                transform: translateY(0px);
            }
            to{
                transform: translateY(8px);
            }
        }

        .brazos{
            width: 220px;
            height: 40px;
            background-image: url(img/piel.jpg);
            background-size: cover;
            background-position: center;
            clip-path: polygon(87% 19%, 100% 53%, 88% 86%, 16% 86%, 0 55%, 15% 19%);
            position: absolute;
            top: 370px;
            left: 30px;

            animation: brazos 1s infinite alternate;
            transform-origin: center;
        }

        @keyframes brazos{
            from{
                transform: rotate(-5deg);
            }
            to{
                transform: rotate(5deg);
            }
        }

        .cuerpo{
            width: 120px;
            height: 180px;
            background-image: url(img/cuerpo.webp);
            background-size: cover;
            background-position: center;
            clip-path: polygon(38% 0, 66% 0, 91% 100%, 12% 100%);
            position: absolute;
            top: 320px;
            left: 90px;

            animation: cuerpo 2s infinite alternate;
        }

        @keyframes cuerpo{
            from{
                transform: translateY(0px);
            }
            to{
                transform: translateY(10px);
            }
        }

        .pie_der{
            width: 100px;
            height: 50px;
            background-image: url(img/zapatos.jpg);
            background-size: cover;
            background-position: center;
            clip-path: ellipse(50% 50% at 50% 50%);
            position: absolute;
            top: 490px;
            left: 55px;

            animation: pie1 0.7s infinite alternate;
        }

        @keyframes pie1{
            from{
                transform: rotate(-10deg) translateY(0px);
            }
            to{
                transform: rotate(10deg) translateY(-8px);
            }
        }

        .pie_izq{
            width: 100px;
            height: 50px;
            background-image: url(img/zapatos.jpg);
            background-size: cover;
            background-position: center;
            clip-path: ellipse(50% 50% at 50% 50%);
            position: absolute;
            top: 490px;
            left: 140px;

            animation: pie2 0.7s infinite alternate;
        }

        @keyframes pie2{
            from{
                transform: rotate(10deg) translateY(-8px);
            }
            to{
                transform: rotate(-10deg) translateY(0px);
            }
        }

        .cono{
            width: 60px;
            height: 90px;
            background-image: url(img/cono.jpg);
            background-size: cover;
            background-position: center;
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            position: absolute;
            top: 360px;
            left: 215px;

            animation: cono 2s infinite alternate;
        }

        @keyframes cono{
            from{
                transform: rotate(-8deg);
            }
            to{
                transform: rotate(8deg);
            }
        }

        .bola1{
            width: 55px;
            height: 55px;
            background-image: url(img/sabor1.webp);
            background-size: cover;
            background-position: center;
            clip-path: circle(50% at 50% 50%);
            position: absolute;
            top: 315px;
            left: 200px;

            animation: bola1 3s infinite;
        }

        @keyframes bola1{
            0%{
                top:315px;
                left:200px;
                transform: rotate(0deg);
            }

            100%{
                top:500px;
                left:250px;
                transform: rotate(360deg);
            }
        }

        .bola2{
            width: 55px;
            height: 55px;
            background-image: url(img/sabor2.avif);
            background-size: cover;
            background-position: center;
            clip-path: circle(50% at 50% 50%);
            position: absolute;
            top: 315px;
            left: 235px;

            animation: bola2 3s infinite 1s;
        }

        @keyframes bola2{
            0%{
                top:315px;
                left:235px;
                transform: rotate(0deg);
            }

            100%{
                top:500px;
                left:320px;
                transform: rotate(360deg);
            }
        }

        .bola3{
            width: 55px;
            height: 55px;
            background-image: url(img/sabor3.avif);
            background-size: cover;
            background-position: center;
            clip-path: circle(50% at 50% 50%);
            position: absolute;
            top: 290px;
            left: 217px;

            animation: bola3 3s infinite 2s;
        }

        @keyframes bola3{
            0%{
                top:290px;
                left:217px;
                transform: rotate(0deg);
            }

            100%{
                top:500px;
                left:400px;
                transform: rotate(360deg);
            }
}

    </style>
</head>

<body>

<div class="contenedor">
    <img class="parque" src="img/parque.jpg">

    <div class="gorrito"></div>
    <div class="cara"></div>
    <div class="brazos"></div>
    <div class="cuerpo"></div>
    <div class="pie_der"></div>
    <div class="pie_izq"></div>

    <div class="cono"></div>

    <div class="bola1"></div>
    <div class="bola2"></div>
    <div class="bola3"></div>
</div>
<a href="index.html">Volver</a>
</body>
</html>
